<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="EduPlatform - Modern Learning Management System" />
  <title>EduPlatform — Learn Without Limits</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet" />
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="css/main.css" />
  <!-- Socket.io client -->
  <script src="https://cdn.socket.io/4.7.1/socket.io.min.js"></script>
</head>
<body>
  <!-- App Root - JS renders everything here -->
  <div id="app">
    <!-- Initial loading screen (shown before JS executes) -->
    <div id="initial-loader">
      <div class="loader-ring">
        <div></div><div></div><div></div><div></div>
      </div>
      <p class="loader-text">EduPlatform</p>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" aria-live="polite" aria-atomic="false"></div>

  <!-- Modal Container -->
  <div id="modal-container"></div>

  <!-- Entry JavaScript Module -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
